<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuipuCFO – Finance AI Readiness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a0840;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      width: 100%;
      max-width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 4px;
    }
    #controls {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px; align-items: center;
    }
    button {
      background: #ffffff; color: #6B21E8; border: none;
      padding: 7px 18px; border-radius: 20px;
      cursor: pointer; font-size: 13px; font-family: sans-serif; font-weight: 700;
      transition: background .2s;
    }
    button:hover { background: #f0e8ff; }
    #timeline {
      width: 200px; height: 4px;
      background: #333; border-radius: 2px; cursor: pointer;
    }
    #timeLabel { color: #aaa; font-size: 12px; font-family: monospace; min-width: 40px; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="controls">
    <button id="btnPlay">▶ Play</button>
    <button id="btnRestart">↺ Restart</button>
    <input type="range" id="timeline" min="0" max="16" step="0.05" value="0" />
    <span id="timeLabel">0.0s</span>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   QuipuCFO – Finance Motion Graphics
   16:9 canvas animation  |  16 seconds total
   ───────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const sandraImg = new Image();
sandraImg.src = 'Sandra.jpg';

const W = 1920, H = 1080;
canvas.width  = W;
canvas.height = H;

/* ── Palette ──────────────────────────────── */
const C = {
  bg      : '#6B21E8',   // QuipuCFO vivid purple
  bgDark  : '#3D1280',   // deep purple for gradient base
  white   : '#FFFFFF',
  gold    : '#F5A623',   // QuipuCFO golden yellow accent (stats, highlights)
  goldDim : '#C4821A',
  red     : '#FF3B5C',
  purple1 : '#8B5CF6',   // lighter purple for glows
  purple2 : '#A78BFA',
  accent  : '#D4AAFF',   // soft lavender for dust / grid
  gridLine: 'rgba(255,255,255,0.08)',
};

/* ── Math helpers ─────────────────────────── */
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ease  = t => t < .5 ? 2*t*t : -1+(4-2*t)*t;        // easeInOut
const easeOut = t => 1 - (1-t)*(1-t);
const easeIn  = t => t*t;

/* ── Seeded RNG (deterministic) ───────────── */
let seed = 42;
function rand(lo=0, hi=1) {
  seed = (seed * 1664525 + 1013904223) & 0xffffffff;
  const n = (seed >>> 0) / 0xffffffff;
  return lo + n*(hi-lo);
}
function randReset() { seed = 42; }

/* ── Font loader ──────────────────────────── */
const fontURL = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap';
const link = document.createElement('link');
link.rel = 'stylesheet'; link.href = fontURL;
document.head.appendChild(link);

/* ═══════════════════════════════════════════
   SCENE DATA  – all particle/element config
   ═══════════════════════════════════════════ */

/* Floating spreadsheet cells */
randReset();
const SHEETS = Array.from({length: 22}, (_, i) => ({
  x : rand(80, W-80),
  y : rand(80, H-80),
  w : rand(130, 220),
  h : rand(80, 130),
  vx: rand(-18, 18),
  vy: rand(-14, 14),
  rot: rand(-0.4, 0.4),
  vr: rand(-0.008, 0.008),
  alpha: rand(0.55, 0.9),
  rows: Math.floor(rand(3, 6)),
  cols: Math.floor(rand(3, 6)),
  redCell: rand() < 0.38,
}));

/* Floating "45%" icons */
randReset();
const ICONS45 = Array.from({length: 12}, (_, i) => ({
  x : rand(100, W-100),
  y : rand(100, H-100),
  vx: rand(-22, 22),
  vy: rand(-18, 18),
  size: rand(34, 62),
  alpha: rand(0.5, 0.85),
  pulse: rand(0, Math.PI*2),
}));

/* Red warning labels */
const LABELS = [
  { text: 'Data Cleaning',         x: W*.18, y: H*.28 },
  { text: 'Manual Reconciliation', x: W*.72, y: H*.22 },
  { text: 'Data Cleaning',         x: W*.62, y: H*.74 },
  { text: 'Manual Reconciliation', x: W*.15, y: H*.69 },
  { text: 'Error: #REF!',          x: W*.48, y: H*.15 },
  { text: 'Error: #REF!',          x: W*.82, y: H*.58 },
];
randReset();
LABELS.forEach(l => {
  l.vx = rand(-16, 16);
  l.vy = rand(-12, 12);
  l.rot = rand(-0.25, 0.25);
});

/* Roadmap nodes */
const NODES = [
  { label: 'Finance-Led AI Strategy',    nx: 0.18, ny: 0.52 },
  { label: 'Use Case Selection & ROI',   nx: 0.40, ny: 0.40 },
  { label: 'Organisational Readiness',   nx: 0.62, ny: 0.52 },
  { label: 'Control-Led Orientation',    nx: 0.84, ny: 0.40 },
];

/* ═══════════════════════════════════════════
   ANIMATION STATE
   ═══════════════════════════════════════════ */
let t      = 0;          // current time in seconds
let lastTS = null;
let playing = false;
const DURATION = 16;

/* ── Sandra – flat-illustration female character ── */
function drawCFO(cx, cy, scale, alpha) {
  if (!sandraImg.complete || sandraImg.naturalWidth === 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const photoH = 420 * scale;
  const photoW = sandraImg.naturalWidth / sandraImg.naturalHeight * photoH;
  const px = cx - photoW / 2;
  const py = cy - photoH * 0.82;

  // Floor shadow
  const shadowG = ctx.createRadialGradient(cx, cy + photoH * 0.18, 0, cx, cy + photoH * 0.18, photoW * 0.55);
  shadowG.addColorStop(0, 'rgba(0,0,0,0.22)');
  shadowG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.ellipse(cx, cy + photoH * 0.18, photoW * 0.52, photoH * 0.07, 0, 0, Math.PI * 2);
  ctx.fillStyle = shadowG; ctx.fill();

  // Draw photo clipped to rounded rect
  const rx = 18 * scale;
  ctx.beginPath();
  ctx.roundRect(px, py, photoW, photoH, rx);
  ctx.clip();
  ctx.drawImage(sandraImg, px, py, photoW, photoH);

  ctx.restore();
}

/* ── Character name card (Moss stresstimonials style) ── */
function drawNameCard(alpha) {
  if (alpha <= 0) return;
  const cx = W/2, cy = H*0.12;
  const bw = 560, bh = 88, bx = cx - bw/2, by = cy - bh/2;

  ctx.save();
  ctx.globalAlpha = alpha;

  // ── tagline above the card
  ctx.font = 'italic 700 24px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('When the month-end close takes 3 weeks\u2026', cx, cy - bh/2 - 24);
  ctx.shadowBlur = 0;

  // card background – solid dark pill for contrast
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // name + age – full white
  ctx.font = 'bold 30px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Meet Sandra, 43', cx, cy - 18);

  // job title – full white
  ctx.font = '600 22px Inter, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('VP of Eternal Close', cx, cy + 18);
  ctx.shadowBlur = 0;

  ctx.restore();
}

/* ── Spreadsheet cell ─────────────────────── */
function drawSheet(s, progress) {
  const { x, y, w, h, rot, alpha, rows, cols, redCell, vx, vy, vr } = s;
  const px = x + vx * progress * 0.15;
  const py = y + vy * progress * 0.15;
  const pr = rot + vr * progress * 8;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(pr);
  ctx.globalAlpha = alpha;

  // card background
  ctx.beginPath();
  ctx.roundRect(-w/2, -h/2, w, h, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // grid lines
  const cw = w / cols, rh = h / rows;
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 0.7;
  for (let c=1; c<cols; c++) {
    ctx.beginPath();
    ctx.moveTo(-w/2 + c*cw, -h/2);
    ctx.lineTo(-w/2 + c*cw,  h/2);
    ctx.stroke();
  }
  for (let r=1; r<rows; r++) {
    ctx.beginPath();
    ctx.moveTo(-w/2, -h/2 + r*rh);
    ctx.lineTo( w/2, -h/2 + r*rh);
    ctx.stroke();
  }

  // one red cell highlight
  if (redCell) {
    ctx.fillStyle = 'rgba(255,59,92,0.35)';
    ctx.fillRect(-w/2, -h/2, cw, rh);
  }

  ctx.restore();
}

/* ── 45% icon ─────────────────────────────── */
function draw45(ic, progress, t) {
  const px = ic.x + ic.vx * progress * 0.12;
  const py = ic.y + ic.vy * progress * 0.12;
  const pulse = 0.8 + 0.2*Math.sin(t*3 + ic.pulse);

  ctx.save();
  ctx.translate(px, py);
  ctx.globalAlpha = ic.alpha * pulse;

  const r = ic.size;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.font = `bold ${r*0.7}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.red;
  ctx.fillText('45%', 0, 0);

  ctx.restore();
}

/* ── Warning label ────────────────────────── */
function drawLabel(lb, progress, alpha) {
  const px = lb.x + lb.vx * progress * 0.10;
  const py = lb.y + lb.vy * progress * 0.10;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(lb.rot);
  ctx.globalAlpha = alpha;

  const fs = 20;
  ctx.font = `bold ${fs}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(lb.text).width;

  ctx.beginPath();
  ctx.roundRect(-tw/2-12, -fs/2-7, tw+24, fs+14, 4);
  ctx.fillStyle = 'rgba(255,59,92,0.20)';
  ctx.fill();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = C.red;
  ctx.fillText(lb.text, 0, 0);

  ctx.restore();
}

/* ── Kinetic BG typography ────────────────── */
function drawKineticBG(alpha, t) {
  const words = ['THE CAPACITY TRAP'];
  ctx.save();
  ctx.globalAlpha = alpha * 0.08;
  ctx.font = `900 ${W*0.12}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;

  const scale = 1 + 0.015*Math.sin(t*0.7);
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.fillText('THE CAPACITY TRAP', 0, 0);

  ctx.restore();
}

/* ── Pressure gauge ───────────────────────── */
function drawPressureGauge(cx, cy, r, fill, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);

  // track
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.PI*0.75, Math.PI*2.25);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();

  // fill arc – color shifts red as it fills
  const red   = Math.floor(lerp(60, 255, fill));
  const green = Math.floor(lerp(200, 59, fill));
  const end   = Math.PI*0.75 + fill * Math.PI*1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.PI*0.75, end);
  ctx.strokeStyle = `rgb(${red},${green},80)`;
  ctx.lineWidth = 8;
  ctx.stroke();

  // needle
  const angle = Math.PI*0.75 + fill * Math.PI*1.5 - Math.PI/2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(angle)*(r-10), Math.sin(angle)*(r-10));
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();

  // label
  ctx.font = `bold 22px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('PRESSURE', 0, r+20);

  ctx.restore();
}

/* ── Ticking clock ───────────────────────── */
function drawClock(cx, cy, r, t, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // tick marks
  for (let i=0; i<12; i++) {
    const a = (i/12)*Math.PI*2 - Math.PI/2;
    const inner = i%3===0 ? r-10 : r-6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*inner, Math.sin(a)*inner);
    ctx.lineTo(Math.cos(a)*(r-2), Math.sin(a)*(r-2));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = i%3===0 ? 2 : 1;
    ctx.stroke();
  }

  // minute hand (fast for urgency)
  const mAngle = (t*2) * Math.PI*2 - Math.PI/2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(mAngle)*(r-12), Math.sin(mAngle)*(r-12));
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // hour hand
  const hAngle = (t*0.2) * Math.PI*2 - Math.PI/2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(hAngle)*(r-22), Math.sin(hAngle)*(r-22));
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 4;
  ctx.stroke();

  // center dot
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI*2);
  ctx.fillStyle = C.red;
  ctx.fill();

  ctx.restore();
}

/* ── Subtitle / overlay text ─────────────── */
function drawSubtitle(lines, alpha, highlightLast=false) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const lineH = 56;
  const totalH = lines.length * lineH;
  let startY = H * 0.80 - totalH / 2;

  lines.forEach((line, i) => {
    const isLast = i === lines.length-1;
    const fs = isLast && highlightLast ? 42 : 36;
    ctx.font = `bold ${fs}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (isLast && highlightLast) {
      ctx.fillStyle = C.gold;
    } else {
      ctx.fillStyle = C.white;
    }
    ctx.fillText(line, W/2, startY + i*lineH);
  });

  ctx.restore();
}

/* ── Roadmap line + nodes ─────────────────── */
function drawRoadmap(progress, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  const pts = NODES.map(n => ({ x: n.nx*W, y: n.ny*H }));

  // draw connecting line segment by segment
  for (let i=0; i<pts.length-1; i++) {
    const segStart = i / (pts.length-1);
    const segEnd   = (i+1) / (pts.length-1);
    const segP = clamp((progress - segStart) / (segEnd - segStart), 0, 1);
    if (segP <= 0) break;

    const x2 = lerp(pts[i].x, pts[i+1].x, segP);
    const y2 = lerp(pts[i].y, pts[i+1].y, segP);

    // glow
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(245,166,35,0.15)';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // draw nodes
  pts.forEach((p, i) => {
    const nodeProgress = i / (pts.length-1);
    const nodeAlpha = clamp((progress - nodeProgress + 0.1) / 0.12, 0, 1);
    if (nodeAlpha <= 0) return;

    ctx.globalAlpha = alpha * nodeAlpha;

    // outer glow
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 40);
    glow.addColorStop(0, 'rgba(245,166,35,0.35)');
    glow.addColorStop(1, 'rgba(245,166,35,0.0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, 40, 0, Math.PI*2);
    ctx.fillStyle = glow;
    ctx.fill();

    // node circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI*2);
    ctx.fillStyle = C.gold;
    ctx.fill();
    ctx.strokeStyle = C.white;
    ctx.lineWidth = 2;
    ctx.stroke();

    // label
    ctx.font = 'bold 24px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.white;
    // wrap long labels onto two lines (split at ' & ' or last space before midpoint)
    const lbl = NODES[i].label;
    const ampIdx = lbl.indexOf(' & ');
    const mid = ampIdx > 0
      ? [lbl.slice(0, ampIdx + 2), lbl.slice(ampIdx + 3)]
      : lbl.length > 20
        ? [lbl.slice(0, lbl.lastIndexOf(' ', Math.floor(lbl.length / 2) + 4)),
           lbl.slice(lbl.lastIndexOf(' ', Math.floor(lbl.length / 2) + 4) + 1)]
        : null;
    if (mid) {
      ctx.fillText(mid[0], p.x, p.y + 22);
      ctx.fillText(mid[1], p.x, p.y + 50);
    } else {
      ctx.fillText(lbl, p.x, p.y + 22);
    }
  });

  ctx.restore();
}

/* ── CTA button ───────────────────────────── */
function drawCTA(alpha, t) {
  if (alpha <= 0) return;
  const pulse = 1 + 0.03*Math.sin(t*4);
  const bw = 500, bh = 80, bx = W/2 - bw/2, by = H*0.78 - bh/2;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H*0.78);
  ctx.scale(pulse, pulse);
  ctx.translate(-W/2, -H*0.78);

  // subtle glow behind button (gold-tinted)
  const glow = ctx.createRadialGradient(W/2, H*0.78, 0, W/2, H*0.78, 220);
  glow.addColorStop(0, 'rgba(245,166,35,0.12)');
  glow.addColorStop(1, 'rgba(245,166,35,0.0)');
  ctx.beginPath();
  ctx.arc(W/2, H*0.78, 220, 0, Math.PI*2);
  ctx.fillStyle = glow;
  ctx.fill();

  // primary pill – white fill (matches QuipuCFO "Join Early Access" button)
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 40);
  ctx.fillStyle = C.white;
  ctx.fill();

  // text – QuipuCFO vivid purple on white
  ctx.font = 'bold 26px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.bg;
  ctx.fillText('Is Your AI Ready for Audit?', W/2, H*0.78);

  ctx.restore();
}

/* ── "WHERE DO YOU START?" glowing box ────── */
function drawStartBox(alpha, t) {
  if (alpha <= 0) return;
  const glow = 0.7 + 0.3*Math.sin(t*2.5);
  const bw = 620, bh = 110, cx = W/2, cy = H*0.20;
  const bx = cx - bw/2, by = cy - bh/2;

  ctx.save();
  ctx.globalAlpha = alpha;

  // outer glow – gold
  ctx.shadowColor = C.gold;
  ctx.shadowBlur  = 40 * glow;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 10);
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.font = 'bold 52px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = C.gold;
  ctx.shadowBlur  = 20 * glow;
  ctx.fillStyle = C.gold;
  ctx.fillText('WHERE DO YOU START?', cx, cy);

  ctx.restore();
}

/* ── Grid / scanlines ─────────────────────── */
function drawGrid(alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.gridLine;
  ctx.lineWidth = 1;
  const step = 80;
  for (let x=0; x<W; x+=step) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=0; y<H; y+=step) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();
}

/* ── Vignette ─────────────────────────────── */
function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(25,5,65,0.65)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ── Particle dust ───────────────────────── */
randReset();
const DUST = Array.from({length: 60}, () => ({
  x: rand(0, W), y: rand(0, H),
  r: rand(1, 3.5),
  vx: rand(-0.3, 0.3), vy: rand(-0.5, -0.1),
  alpha: rand(0.1, 0.4),
  phase: rand(0, Math.PI*2),
}));
function drawDust(t, masterAlpha) {
  ctx.save();
  DUST.forEach(d => {
    const a = masterAlpha * d.alpha * (0.6 + 0.4*Math.sin(t*1.2 + d.phase));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(
      (d.x + d.vx*t*20) % W,
      ((d.y + d.vy*t*20) % H + H) % H,
      d.r, 0, Math.PI*2
    );
    ctx.fillStyle = C.purple2;
    ctx.fill();
  });
  ctx.restore();
}

/* ═══════════════════════════════════════════
   MAIN RENDER
   ═══════════════════════════════════════════ */
function render(time) {
  const T = clamp(time, 0, DURATION);

  // ── Background ────────────────────────────
  // Background: QuipuCFO vivid purple (#6B21E8), shifts slightly warmer under urgency
  const urgencyMix = clamp((T - 3) / 4, 0, 1) * clamp((8-T)/2, 0, 1);
  const bg = ctx.createLinearGradient(0, 0, W, H);
  // base: #6B21E8 = rgb(107,33,232) → slight warm shift under pressure
  const bgR = Math.floor(lerp(107, 130, urgencyMix));
  const bgG = Math.floor(lerp(33,  20, urgencyMix));
  const bgB = Math.floor(lerp(232, 210, urgencyMix));
  bg.addColorStop(0, `rgb(${bgR},${bgG},${bgB})`);
  bg.addColorStop(1, `rgb(35,8,90)`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid(0.6);

  // ── Phase alphas ──────────────────────────
  // SH01: 0-8s (chaos phase)
  const chaosAlpha   = clamp(T/0.8, 0, 1) * clamp((9-T)/1.0, 0, 1);
  // SH02: 8-16s (solution phase)
  const solveAlpha   = easeOut(clamp((T-8)/1.5, 0, 1));
  const roadmapP     = clamp((T-8.5)/4.5, 0, 1);
  const ctaAlpha     = easeOut(clamp((T-13)/1.2, 0, 1));
  const startBoxA    = easeOut(clamp((T-10)/1.5, 0, 1)) * clamp((T-10)/1, 0, 1);
  const pressureAlpha= clamp((T-4)/1.0, 0, 1) * clamp((8.5-T)/0.8, 0, 1);
  const clockAlpha   = clamp((T-3.5)/1.0, 0, 1) * clamp((8.5-T)/0.8, 0, 1);

  // Kinetic BG text
  drawKineticBG(chaosAlpha, T);

  // Dust particles
  drawDust(T, 0.8);

  // ── CHAOS ELEMENTS (SH01) ─────────────────
  if (chaosAlpha > 0) {
    const chaosProgress = clamp(T/8, 0, 1);
    SHEETS.forEach(s => drawSheet(s, chaosProgress));
    ICONS45.forEach(ic => draw45(ic, chaosProgress, T));
    LABELS.forEach(lb => drawLabel(lb, chaosProgress, chaosAlpha * 0.9));
  }

  // Pressure gauge (appears ~4s)
  if (pressureAlpha > 0) {
    const gaugeVal = clamp((T-4)/3.5, 0, 1);
    drawPressureGauge(W*0.85, H*0.28, 70, gaugeVal, pressureAlpha);
  }

  // Clock (appears ~3.5s)
  if (clockAlpha > 0) {
    drawClock(W*0.14, H*0.25, 55, T, clockAlpha);
  }

  // ── CFO CHARACTER "SANDRA" ───────────────
  // cfoAlpha is independent of chaosAlpha so Sandra is visible from the first frame
  const cfoScale  = lerp(1.0, 0.65, solveAlpha);
  const cfoAlpha  = clamp(T / 0.5, 0, 1) * clamp((9 - T) / 1.0, 0, 1);
  const cfoY      = H*0.48 + Math.sin(T*0.4)*5;
  const nameCardA = clamp((T - 0.3) / 0.6, 0, 1) * clamp((8 - T) / 0.8, 0, 1);
  if (cfoAlpha > 0.02) {
    drawCFO(W/2, cfoY, cfoScale, cfoAlpha);
    drawNameCard(nameCardA * cfoAlpha);
  }

  // ── SOLUTION ELEMENTS (SH02) ──────────────
  if (solveAlpha > 0) {
    drawRoadmap(roadmapP, solveAlpha);
    drawStartBox(startBoxA * solveAlpha, T);
    drawCTA(ctaAlpha, T);
  }

  // ── TEXT OVERLAYS ─────────────────────────
  // 0-4s
  const text1A = clamp(T/0.6, 0, 1) * clamp((4.2-T)/0.6, 0, 1);
  drawSubtitle(['Still spending 45% of your time cleaning data?'], text1A);

  // 4-8s
  const text2A = clamp((T-4)/0.6, 0, 1) * clamp((8.2-T)/0.6, 0, 1);
  drawSubtitle([
    'The Pressure is Real.',
    '72% of CFOs say AI is critical...',
    'but only 10% have scaled.',
  ], text2A);

  // 8-12s
  const text3A = clamp((T-8)/0.5, 0, 1) * clamp((12.5-T)/0.5, 0, 1);
  drawSubtitle(['Stop the Paradox.', 'Build your foundation.'], text3A);

  // 13-16s (only CTA button text, already in drawCTA)

  drawVignette();

  // ── QuipuCFO logo watermark ───────────────
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.font = 'bold 26px Inter, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = C.gold;
  ctx.fillText('QuipuCFO', 36, H-30);
  ctx.restore();
}

/* ═══════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════ */
let rafId = null;

function loop(ts) {
  if (!playing) return;
  if (lastTS === null) lastTS = ts;
  const dt = (ts - lastTS) / 1000;
  lastTS = ts;
  t = Math.min(t + dt, DURATION);
  render(t);
  updateControls();
  if (t < DURATION) {
    rafId = requestAnimationFrame(loop);
  } else {
    // loop back to start automatically
    t = 0;
    lastTS = null;
    rafId = requestAnimationFrame(loop);
  }
}

/* ── Controls ──────────────────────────────── */
const btnPlay    = document.getElementById('btnPlay');
const btnRestart = document.getElementById('btnRestart');
const timeline   = document.getElementById('timeline');
const timeLabel  = document.getElementById('timeLabel');

function updateControls() {
  timeline.value = t;
  timeLabel.textContent = t.toFixed(1)+'s';
}

btnPlay.addEventListener('click', () => {
  if (playing) {
    playing = false;
    lastTS  = null;
    btnPlay.textContent = '▶ Play';
  } else {
    if (t >= DURATION) t = 0;
    playing = true;
    lastTS  = null;
    btnPlay.textContent = '⏸ Pause';
    rafId   = requestAnimationFrame(loop);
  }
});

btnRestart.addEventListener('click', () => {
  t = 0;
  lastTS = null;
  playing = true;
  btnPlay.textContent = '⏸ Pause';
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
  updateControls();
});

timeline.addEventListener('input', () => {
  t = parseFloat(timeline.value);
  timeLabel.textContent = t.toFixed(1)+'s';
  render(t);
});

// Auto-play on load
playing = true;
btnPlay.textContent = '⏸ Pause';
rafId = requestAnimationFrame(loop);
</script>
</body>
